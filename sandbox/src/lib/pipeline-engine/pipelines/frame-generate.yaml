id: frame-generate
display_name: "帧生成管线"
description: "首帧(带角色参考) → 尾帧(带首帧+角色参考)"
version: "1.0"

steps:
  - id: gen_first_frame
    type: atomic_workflow
    workflow_id: qwen-2511-edit-plus
    description: "基于场景描述和角色参考图生成首帧"
    inputs:
      composite_prompt: ${params.first_prompt}
      scene_prompt: ${params.scene_prompt}
      character_ref_1: ${params.referenceImages[0]}
      character_ref_2: ${params.referenceImages[1]}
      character_ref_3: ${params.referenceImages[2]}
      seed: ${params.seed}
      width: ${params.width}
      height: ${params.height}
    outputs:
      first_frame: ${outputs[0].localPath}

  - id: gen_last_frame
    type: atomic_workflow
    workflow_id: qwen-2511-edit-plus
    description: "基于首帧+角色参考生成尾帧"
    depends_on: [gen_first_frame]
    inputs:
      composite_prompt: ${params.last_prompt}
      scene_prompt: ${params.scene_prompt}
      character_ref_1: ${params.referenceImages[0]}
      character_ref_2: ${params.referenceImages[1]}
      character_ref_3: ${params.referenceImages[2]}
      seed: ${params.seed + 1}
      width: ${params.width}
      height: ${params.height}
    outputs:
      last_frame: ${outputs[0].localPath}

outputs:
  primary: ${steps.gen_last_frame.outputs[0]}
  intermediates:
    first_frame: ${steps.gen_first_frame.outputs[0]}
    last_frame: ${steps.gen_last_frame.outputs[0]}